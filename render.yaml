services:
  - type: worker
    name: telegram-shop-bot
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: MAIN_BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
